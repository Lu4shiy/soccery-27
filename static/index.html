<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soccery 27</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, Arial, sans-serif;
            background-color: #17212b;
            color: white;
            margin: 0;
            padding: 16px;
            min-height: 100vh;
        }
        h1 { color: #52a8ff; margin: 0 0 4px; text-align: center;}
        h2 { margin: 8px 0; }
        p { color: #8e9eb5; margin: 4px 0; }
        .hidden { display: none !important; }
        
        .card {
            background-color: #232e3c;
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .btn {
            background-color: #52a8ff;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 10px;
            width: 100%;
            font-weight: bold;
            margin-top: 16px;
            cursor: pointer;
        }
        .btn:active { background-color: #3b82c4; }
        .btn-back {
            background-color: transparent;
            color: #52a8ff;
            border: 1px solid #52a8ff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 12px;
            cursor: pointer;
        }

        /* Стили для заглушек логотипов */
        .logo-container {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background-color: #17212b;
            margin-right: 12px;
            flex-shrink: 0;
            overflow: hidden;
        }
        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 4px;
        }
        .logo-fallback {
            font-weight: bold;
            color: #52a8ff;
            font-size: 20px;
            text-transform: uppercase;
        }
        .logo-large {
            width: 80px !important;
            height: 80px !important;
            margin: 0 auto 16px auto !important;
            font-size: 36px !important;
            padding: 8px !important;
        }

        /* Сетка для лиг */
        .leagues-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }
        .league-card {
            background: #232e3c;
            border-radius: 12px;
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-align: center;
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .league-card:active { border-color: #52a8ff; }
        .league-card .logo-container {
            width: 60px;
            height: 60px;
            margin: 0 0 10px 0;
            background-color: #17212b;
        }
        .league-card .logo-fallback { font-size: 28px; }
        .league-name { font-size: 13px; font-weight: bold; line-height: 1.2; }

        /* Список клубов */
        .club-card {
            background: #232e3c;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .club-card:active { border-color: #52a8ff; }
        .club-info { display: flex; align-items: center; }
        .club-name { font-weight: bold; font-size: 15px; }
        .club-meta { color: #8e9eb5; font-size: 12px; margin-top: 2px; }
        .club-ovr {
            background: #17212b;
            color: #52a8ff;
            font-weight: bold;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 14px;
            min-width: 42px;
            text-align: center;
        }

        /* Список игроков (Состав) */
        .squad-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .player-row {
            background: #232e3c;
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .player-ovr {
            font-size: 18px;
            font-weight: bold;
            width: 36px;
            text-align: center;
            padding: 4px 0;
            border-radius: 6px;
        }
        /* Цвета рейтинга как в FIFA */
        .ovr-gold { background: #e6c544; color: #1a1a1a; }
        .ovr-silver { background: #a3a3a3; color: #1a1a1a; }
        .ovr-bronze { background: #b87d4b; color: #1a1a1a; }
        
        .player-name-block { display: flex; flex-direction: column; }
        .player-name { font-weight: bold; font-size: 14px; }
        .player-meta { color: #8e9eb5; font-size: 11px; margin-top: 2px; }
        
        .player-pos {
            background: #17212b;
            color: #52a8ff;
            font-weight: bold;
            font-size: 12px;
            padding: 4px 6px;
            border-radius: 4px;
            width: 38px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- ЭКРАН 1: Приветствие -->
    <div id="screen-welcome" class="screen">
        <h1>Soccery 27</h1>
        <p style="text-align:center;">Футбольный менеджер нового поколения</p>
        <div class="card">
            <h2 id="user-name">Привет, Игрок!</h2>
            <p id="user-status">Твой клуб ждет тебя. Пора начинать карьеру.</p>
        </div>
        <button class="btn" id="btn-start">Начать карьеру</button>
    </div>

    <!-- ЭКРАН 2: Загрузка -->
    <div id="screen-loading" class="screen hidden">
        <div class="card">
            <h2>⏳ Загружаем данные...</h2>
            <p>Первый запрос после «сна» сервера может занять до минуты.</p>
        </div>
    </div>

    <!-- ЭКРАН 3: Выбор лиги -->
    <div id="screen-leagues" class="screen hidden">
        <h2>Выбери лигу</h2>
        <div id="leagues-grid" class="leagues-grid"></div>
    </div>

    <!-- ЭКРАН 4: Выбор клуба -->
    <div id="screen-clubs" class="screen hidden">
        <button class="btn-back" id="btn-back-leagues">← Назад к лигам</button>
        <h2 id="selected-league-title">Клубы</h2>
        <div id="clubs-list" style="margin-top: 16px;"></div>
    </div>

    <!-- ЭКРАН 5: Подтверждение -->
    <div id="screen-confirm" class="screen hidden">
        <h2 style="text-align:center;">✅ Готово!</h2>
        <div class="card" style="text-align:center;">
            <div id="confirm-logo"></div>
            <p>Твой клуб:</p>
            <h2 id="confirm-club" style="color:#52a8ff;"></h2>
            <p id="confirm-league"></p>
        </div>
        <button class="btn" id="btn-continue" style="margin-bottom: 10px;">Продолжить</button>
        <button class="btn" id="btn-reset" style="background-color: #a82929;">Сменить клуб</button>
    </div>

    <!-- ЭКРАН 6: Состав команды -->
    <div id="screen-squad" class="screen hidden">
        <button class="btn-back" id="btn-back-confirm">← Назад</button>
        <h2 id="squad-title" style="margin-bottom: 16px;">Состав команды</h2>
        <div id="squad-list" class="squad-container"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const API_BASE = window.location.origin;
        const userId = tg.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : "dev_user";
        const userName = tg.initDataUnsafe?.user?.first_name || "Игрок";

        document.getElementById("user-name").innerText = `Привет, ${userName}!`;

        let allClubs = [];
        let currentClubId = null;
        let currentClubName = "";
        let currentLeague = "";

        // 1. Строгая функция: убирает ВСЕ спецсимволы, точки, апострофы и ударения (ö -> o, ú -> u)
        function slugify(text) {
            if (!text) return "";
            return text
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "") // Убирает умлауты и акценты
                .replace(/['’\.]/g, '')          // Убирает точки и апострофы
                .replace(/[^a-z0-9\s-]/g, '')    // Оставляет только буквы, цифры, пробелы и дефисы
                .trim()
                .replace(/[\s_]+/g, '-')         // Пробелы -> дефисы
                .replace(/-+/g, '-');            // Убирает двойные дефисы
        }

        // 2. Умная проверка форматов: если нет PNG, ищем SVG, если нет SVG, ищем WEBP
        function handleImgError(img, type, slug, fallbackChar) {
            const currentExt = img.src.split('.').pop().split('?')[0];
            let nextSrc = '';
            
            if (currentExt === 'png') {
                nextSrc = `/static/logos/${type}/${slug}.svg?v=9`;
            } else if (currentExt === 'svg') {
                nextSrc = `/static/logos/${type}/${slug}.webp?v=9`;
            } else {
                // Если ничего не нашли — показываем букву
                img.style.display = 'none';
                img.nextElementSibling.style.display = 'block';
                return;
            }
            img.src = nextSrc;
        }

        // 3. Генерация HTML логотипа
        function getLogoHTML(type, name, sizeClass = '') {
            const slug = slugify(name);
            const src = `/static/logos/${type}/${slug}.png?v=9`; // Всегда начинаем с PNG
            const fallbackChar = name ? name.charAt(0) : "?";
            
            return `
                <div class="logo-container ${sizeClass}">
                    <img src="${src}" class="logo-img" 
                         onerror="handleImgError(this, '${type}', '${slug}', '${fallbackChar}')" 
                         alt="${name}">
                    <div class="logo-fallback" style="display:none;">${fallbackChar}</div>
                </div>
            `;
        }

        function showScreen(name) {
            document.querySelectorAll(".screen").forEach(s => s.classList.add("hidden"));
            document.getElementById("screen-" + name).classList.remove("hidden");
        }

        async function checkManager() {
            try {
                const res = await fetch(`${API_BASE}/api/manager/${encodeURIComponent(userId)}`);
                const data = await res.json();
                if (data.has_club) {
                    // Передаем ID клуба в функцию подтверждения
                    showConfirm(data.club_name, data.league, false, data.club_id);
                    return true;
                }
            } catch (e) { console.error(e); }
            return false;
        }

        async function loadData() {
            showScreen("loading");
            try {
                const res = await fetch(`${API_BASE}/api/clubs`);
                if (!res.ok) throw new Error("HTTP " + res.status);
                allClubs = await res.json();
                
                if (!allClubs.length) {
                    tg.showAlert("Клубы не загружены. Выполните /admin/seed.");
                    showScreen("welcome");
                    return;
                }
                
                renderLeagues();
                showScreen("leagues");
            } catch (e) {
                tg.showAlert("Ошибка загрузки: " + e.message);
                showScreen("welcome");
            }
        }

        function renderLeagues() {
            const uniqueLeagues = [...new Set(allClubs.map(c => c.league))].filter(l => l).sort();
            const grid = document.getElementById("leagues-grid");
            grid.innerHTML = "";

            uniqueLeagues.forEach(league => {
                const card = document.createElement("div");
                card.className = "league-card";
                card.innerHTML = `
                    ${getLogoHTML('leagues', league)}
                    <div class="league-name">${league}</div>
                `;
                card.onclick = () => openLeague(league);
                grid.appendChild(card);
            });
        }

        function openLeague(league) {
            document.getElementById("selected-league-title").innerText = league;
            
            let filtered = allClubs.filter(c => c.league === league);
            filtered.sort((a, b) => (b.avg_ovr || 0) - (a.avg_ovr || 0));

            const list = document.getElementById("clubs-list");
            list.innerHTML = filtered.map(c => `
                <div class="club-card" data-id="${c.id}" data-name="${c.name}" data-league="${c.league}">
                    <div class="club-info">
                        ${getLogoHTML('clubs', c.name)}
                        <div>
                            <div class="club-name">${c.name}</div>
                            <div class="club-meta">${c.players} игроков</div>
                        </div>
                    </div>
                    <div class="club-ovr">${c.avg_ovr || "—"}</div>
                </div>
            `).join("");

            list.querySelectorAll(".club-card").forEach(el => {
                el.onclick = () => {
                    const id = el.dataset.id;
                    const name = el.dataset.name;
                    const league = el.dataset.league;
                    tg.showConfirm(`Выбрать клуб "${name}"?`, (ok) => {
                        if (ok) selectClub(id, name, league);
                    });
                };
            });

            showScreen("clubs");
        }

        async function selectClub(clubId, clubName, league) {
            try {
                const res = await fetch(`${API_BASE}/api/select-club`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        telegram_id: userId,
                        first_name: userName,
                        club_id: parseInt(clubId, 10),
                    }),
                });
                const data = await res.json();
                if (!res.ok) {
                    tg.showAlert(data.detail || "Ошибка при выборе");
                    return;
                }
                showConfirm(data.club_name, data.league, true, parseInt(clubId, 10));
            } catch (e) {
                tg.showAlert("Сетевая ошибка: " + e.message);
            }
        }

        function showConfirm(clubName, league, isNew, clubId) {
            currentClubName = clubName;
            currentLeague = league;
            if (clubId) currentClubId = clubId;

            document.getElementById("confirm-club").innerText = clubName;
            document.getElementById("confirm-league").innerText = league;
            
            document.getElementById("confirm-logo").innerHTML = getLogoHTML('clubs', clubName, 'logo-large');
            document.getElementById("btn-continue").innerText = isNew ? "Продолжить" : "Играть";
            showScreen("confirm");
        }

        async function loadSquad() {
            if (!currentClubId) {
                tg.showAlert("Ошибка: ID клуба не найден. Попробуйте выбрать клуб заново.");
                return;
            }
            
            const listContainer = document.getElementById("squad-list");
            listContainer.innerHTML = `<p style="text-align:center; color:#8e9eb5;">⏳ Загружаем игроков...</p>`;
            document.getElementById("squad-title").innerText = `Состав: ${currentClubName}`;
            showScreen("squad");

            try {
                const res = await fetch(`${API_BASE}/api/clubs/${currentClubId}/players`);
                if (!res.ok) throw new Error("Ошибка сервера");
                const players = await res.json();
                
                if (!players.length) {
                    listContainer.innerHTML = `<p style="text-align:center;">В команде пока нет игроков.</p>`;
                    return;
                }

                listContainer.innerHTML = players.map(p => {
                    let ovrClass = "ovr-bronze";
                    if (p.overall >= 75) ovrClass = "ovr-gold";
                    else if (p.overall >= 65) ovrClass = "ovr-silver";

                    let shortPos = p.position;
                    if (p.position.includes("Goalkeeper")) shortPos = "GK";
                    else if (p.position.includes("Back")) shortPos = "DEF";
                    else if (p.position.includes("Midfield")) shortPos = "MID";
                    else if (p.position.includes("Forward") || p.position.includes("Striker") || p.position.includes("Winger")) shortPos = "ATT";

                    return `
                        <div class="player-row">
                            <div class="player-info">
                                <div class="player-ovr ${ovrClass}">${p.overall}</div>
                                <div class="player-pos">${shortPos}</div>
                                <div class="player-name-block">
                                    <div class="player-name">${p.name}</div>
                                    <div class="player-meta">${p.nationality} · ${p.age} лет</div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join("");

            } catch (e) {
                listContainer.innerHTML = `<p style="text-align:center; color:#ff6b6b;">Ошибка загрузки: ${e.message}</p>`;
            }
        }

        // --- Обработчики кнопок ---
        document.getElementById("btn-start").onclick = async () => {
            const hasClub = await checkManager();
            if (!hasClub) await loadData();
        };

        document.getElementById("btn-back-leagues").onclick = () => {
            showScreen("leagues");
        };

        document.getElementById("btn-continue").onclick = () => {
            loadSquad();
        };

        document.getElementById("btn-back-confirm").onclick = () => {
            showScreen("confirm");
        };

        document.getElementById("btn-reset").onclick = () => {
            tg.showConfirm("Ты уверен, что хочешь сбросить клуб и выбрать заново?", async (ok) => {
                if (!ok) return;
                try {
                    const res = await fetch(`${API_BASE}/api/reset-club/${userId}`, { method: 'DELETE' });
                    if (res.ok) {
                        window.location.reload();
                    } else {
                        tg.showAlert("Ошибка при сбросе");
                    }
                } catch (e) {
                    tg.showAlert("Сетевая ошибка");
                }
            });
        };
    </script>
</body>
</html>
