<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soccery 27</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, Arial, sans-serif;
            background-color: #17212b;
            color: white;
            margin: 0;
            padding: 16px;
            min-height: 100vh;
        }
        h1 { color: #52a8ff; margin: 0 0 4px; }
        h2 { margin: 8px 0; }
        p  { color: #8e9eb5; margin: 4px 0; }
        .hidden { display: none !important; }
        .card {
            background-color: #232e3c;
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .btn {
            background-color: #52a8ff;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 10px;
            width: 100%;
            font-weight: bold;
            margin-top: 16px;
            cursor: pointer;
        }
        .btn:active { background-color: #3b82c4; }

        #search {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #2f3b4d;
            background: #232e3c;
            color: white;
            font-size: 15px;
            margin-bottom: 12px;
        }

        #league-tabs {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 8px;
            padding-bottom: 8px;
            margin-bottom: 8px;
        }
        .tab {
            white-space: nowrap;
            background: #232e3c;
            color: #8e9eb5;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }
        .tab.active { background: #52a8ff; color: white; }

        .club-card {
            background: #232e3c;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .club-card:active { border-color: #52a8ff; }
        .club-name { font-weight: bold; font-size: 15px; }
        .club-meta { color: #8e9eb5; font-size: 12px; margin-top: 2px; }
        .club-ovr {
            background: #17212b;
            color: #52a8ff;
            font-weight: bold;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 14px;
            min-width: 42px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- ЭКРАН 1: Приветствие -->
    <div id="screen-welcome" class="screen">
        <h1>Soccery 27</h1>
        <p>Футбольный менеджер нового поколения</p>
        <div class="card">
            <h2 id="user-name">Привет, Игрок!</h2>
            <p id="user-status">Твой клуб ждет тебя. Пора начинать карьеру.</p>
        </div>
        <button class="btn" id="btn-start">Начать карьеру</button>
    </div>

    <!-- ЭКРАН 2: Загрузка -->
    <div id="screen-loading" class="screen hidden">
        <div class="card">
            <h2>⏳ Загружаем клубы...</h2>
            <p>Первый запрос после «сна» сервера может занять до минуты.</p>
        </div>
    </div>

    <!-- ЭКРАН 3: Выбор клуба -->
    <div id="screen-clubs" class="screen hidden">
        <h2>Выбери свой клуб</h2>
        <p id="clubs-counter"></p>
        <input id="search" placeholder="🔍 Поиск клуба..." />
        <div id="league-tabs"></div>
        <div id="clubs-list"></div>
    </div>

    <!-- ЭКРАН 4: Подтверждение -->
    <div id="screen-confirm" class="screen hidden">
        <h2>✅ Готово!</h2>
        <div class="card">
            <p>Твой клуб:</p>
            <h2 id="confirm-club" style="color:#52a8ff;"></h2>
            <p id="confirm-league"></p>
        </div>
        <button class="btn" id="btn-continue">Продолжить</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const API_BASE = window.location.origin;
        const userId = tg.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : "dev_user";
        const userName = tg.initDataUnsafe?.user?.first_name || "Игрок";

        document.getElementById("user-name").innerText = `Привет, ${userName}!`;

        let allClubs = [];
        let currentLeague = null;

        function showScreen(name) {
            document.querySelectorAll(".screen").forEach(s => s.classList.add("hidden"));
            document.getElementById("screen-" + name).classList.remove("hidden");
        }

        async function checkManager() {
            try {
                const res = await fetch(`${API_BASE}/api/manager/${encodeURIComponent(userId)}`);
                const data = await res.json();
                if (data.has_club) {
                    showConfirm(data.club_name, data.league, false);
                    return true;
                }
            } catch (e) {
                console.error("checkManager error:", e);
            }
            return false;
        }

        async function loadClubs() {
            showScreen("loading");
            try {
                const res = await fetch(`${API_BASE}/api/clubs`);
                if (!res.ok) throw new Error("HTTP " + res.status);
                allClubs = await res.json();
                if (!allClubs.length) {
                    tg.showAlert("Клубы не загружены. Попроси администратора выполнить /admin/seed.");
                    showScreen("welcome");
                    return;
                }
                renderLeagueTabs();
                renderClubs();
                showScreen("clubs");
            } catch (e) {
                tg.showAlert("Не удалось загрузить клубы: " + e.message);
                showScreen("welcome");
            }
        }

        function renderLeagueTabs() {
            const container = document.getElementById("league-tabs");
            container.innerHTML = "";
            const leagues = [...new Set(allClubs.map(c => c.league))].sort();

            const allBtn = document.createElement("button");
            allBtn.className = "tab" + (currentLeague === null ? " active" : "");
            allBtn.textContent = "Все";
            allBtn.onclick = () => { currentLeague = null; renderLeagueTabs(); renderClubs(); };
            container.appendChild(allBtn);

            leagues.forEach(l => {
                const btn = document.createElement("button");
                btn.className = "tab" + (currentLeague === l ? " active" : "");
                btn.textContent = l;
                btn.onclick = () => { currentLeague = l; renderLeagueTabs(); renderClubs(); };
                container.appendChild(btn);
            });
        }

        function renderClubs() {
            const search = (document.getElementById("search").value || "").toLowerCase();
            let filtered = allClubs;

            if (currentLeague) filtered = filtered.filter(c => c.league === currentLeague);
            if (search) filtered = filtered.filter(c => c.name.toLowerCase().includes(search));
            filtered = filtered.slice().sort((a, b) => (b.avg_ovr || 0) - (a.avg_ovr || 0));

            document.getElementById("clubs-counter").innerText =
                `Найдено клубов: ${filtered.length}`;

            const list = document.getElementById("clubs-list");
            if (!filtered.length) {
                list.innerHTML = `<div class="card"><p>Ничего не найдено</p></div>`;
                return;
            }

            list.innerHTML = filtered.map(c => `
                <div class="club-card" data-id="${c.id}" data-name="${c.name}" data-league="${c.league}">
                    <div>
                        <div class="club-name">${c.name}</div>
                        <div class="club-meta">${c.league} · ${c.players} игроков</div>
                    </div>
                    <div class="club-ovr">${c.avg_ovr || "—"}</div>
                </div>
            `).join("");

            list.querySelectorAll(".club-card").forEach(el => {
                el.onclick = () => {
                    const id = el.dataset.id;
                    const name = el.dataset.name;
                    const league = el.dataset.league;
                    tg.showConfirm(`Выбрать клуб "${name}"?`, (ok) => {
                        if (ok) selectClub(id, name, league);
                    });
                };
            });
        }

        async function selectClub(clubId, clubName, league) {
            try {
                const res = await fetch(`${API_BASE}/api/select-club`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        telegram_id: userId,
                        first_name: userName,
                        club_id: parseInt(clubId, 10),
                    }),
                });
                const data = await res.json();
                if (!res.ok) {
                    tg.showAlert(data.detail || "Ошибка при выборе клуба");
                    return;
                }
                showConfirm(data.club_name, data.league, true);
            } catch (e) {
                tg.showAlert("Сетевая ошибка: " + e.message);
            }
        }

        function showConfirm(clubName, league, isNew) {
            document.getElementById("confirm-club").innerText = clubName;
            document.getElementById("confirm-league").innerText = league;
            document.getElementById("btn-continue").innerText = isNew ? "Продолжить" : "Играть";
            showScreen("confirm");
        }

        document.getElementById("btn-start").onclick = async () => {
            const hasClub = await checkManager();
            if (!hasClub) await loadClubs();
        };

        document.getElementById("search").oninput = renderClubs;

        document.getElementById("btn-continue").onclick = () => {
            tg.showAlert("Карьера сохранена! Следующий экран (состав команды) — в разработке.");
        };
    </script>
</body>
</html>
