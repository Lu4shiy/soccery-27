<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soccery 27</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #17212b; color: white; text-align: center; padding: 20px; margin: 0; }
        .card { background-color: #232e3c; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { color: #52a8ff; margin-bottom: 5px; }
        p { color: #8e9eb5; }
        .btn { background-color: #52a8ff; color: white; border: none; padding: 15px 30px; font-size: 16px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 20px; cursor: pointer; }
        .btn:active { background-color: #3b82c4; }
    </style>
</head>
<body>
    <h1>Soccery 27</h1>
    <p>Футбольный менеджер нового поколения</p>
    
    <div class="card">
        <h2 id="user-name">Привет, Игрок!</h2>
        <p>Твой клуб ждет тебя. Пора начинать карьеру.</p>
    </div>

    <button class="btn" onclick="startGame()">Начать карьеру</button>

    <script>
        // Инициализация Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // Получаем имя пользователя из Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = "Привет, " + tg.initDataUnsafe.user.first_name + "!";
        }

        // Функция, которая сработает при нажатии на кнопку
        function startGame() {
            tg.showAlert("Сервер на связи! Скоро тут появится выбор клуба.");
        }
    </script>
</body>
</html>
